<svg xmlns="http://www.w3.org/2000/svg" width="808" height="240" viewBox="46 38 808 240" role="img" aria-label="Abhishek Basnet — developer, Nepal">
  <style>
    .name { font: 300 46px 'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif; letter-spacing: -0.5px; fill: #ECEFF4; }
    .mono { font: 400 13px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.5px; fill: #7B88A1; }
    .ridge { fill: none; stroke: #88C0D0; stroke-width: 1.25; stroke-linejoin: miter; stroke-dasharray: 1; animation: draw 2.8s cubic-bezier(.6,.05,.3,1) both; }
    .ground { stroke: #3B4252; stroke-width: 1; }
    .sun { fill: #BF616A; animation: rise 2.8s ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ridge, .sun { animation: none; } }
