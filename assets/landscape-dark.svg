    </mask>
    <linearGradient id="meteor-tail">
      <stop offset="0" stop-color="#ECEFF4" stop-opacity="0"/>
      <stop offset="1" stop-color="#ECEFF4" stop-opacity=".85"/>
    </linearGradient>
  </defs>

