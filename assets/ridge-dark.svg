<svg xmlns="http://www.w3.org/2000/svg" width="808" height="300" viewBox="46 36 808 300" role="img" aria-label="Abhishek Basnet, backend engineer — flutter, go, fastapi">
  <style>
    .name { font: 300 30px 'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif; letter-spacing: -0.3px; fill: #ECEFF4; }
    .mono { font: 400 11px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.8px; fill: #8F9BB3; }
    .peak { font: 500 12px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #ECEFF4; }
    .ridge { fill: none; stroke: #88C0D0; stroke-width: 1.25; stroke-linejoin: miter; stroke-dasharray: 1; animation: draw 2.6s cubic-bezier(.6,.05,.3,1) both; }
    .ground { stroke: #3B4252; stroke-width: 1; }
    .lead { stroke: #8F9BB3; stroke-width: 1; stroke-dasharray: 2 3; }
    .dot { fill: #88C0D0; }
    .mark { animation: show 0.8s ease-out backwards; }
    .m1 { animation-delay: 1.6s; } .m2 { animation-delay: 2.0s; } .m3 { animation-delay: 2.4s; }
    .sun { fill: #BF616A; animation: rise 3s ease-out backwards; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes show { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ridge, .sun, .mark { animation: none; } }
  </style>

  <text class="mono" x="48" y="56">28.39° N   84.12° E</text>
  <circle class="sun" cx="792" cy="118" r="6"/>

  <path class="ridge" pathLength="1" d="M48 262 L110 252 L150 256 L210 222 L236 230 L268 194 L300 214 L338 202 L380 226 L420 184 L452 150 L486 176 L516 168 L560 214 L604 202 L652 180 L690 212 L740 236 L790 228 L852 250"/>

  <g class="mark m1"><line class="lead" x1="268" y1="186" x2="268" y2="112"/><circle class="dot" cx="268" cy="194" r="2.5"/><text class="peak" x="268" y="100" text-anchor="middle">flutter</text></g>
  <g class="mark m2"><line class="lead" x1="452" y1="142" x2="452" y2="112"/><circle class="dot" cx="452" cy="150" r="2.5"/><text class="peak" x="452" y="100" text-anchor="middle">go</text></g>
  <g class="mark m3"><line class="lead" x1="652" y1="172" x2="652" y2="112"/><circle class="dot" cx="652" cy="180" r="2.5"/><text class="peak" x="652" y="100" text-anchor="middle">fastapi</text></g>

  <line class="ground" x1="48" y1="272" x2="852" y2="272"/>
  <text class="name" x="46" y="318">Abhishek Basnet</text>
  <text class="mono" x="852" y="316" text-anchor="end">backend engineer · nepal</text>
</svg>
