  <path class="trace line" pathLength="1" d="M48 262 L110 252 L150 256 L210 222 L236 230 L268 194 L300 214 L338 202 L380 226 L420 184 L452 150 L486 176 L516 168 L560 214 L604 202 L652 180 L690 212 L740 236 L790 228 L852 250"/>

  <g class="mark m1"><line class="lead" x1="268" y1="186" x2="268" y2="112"/><circle class="dot" cx="268" cy="194" r="2.5"/><g class="pulse p1"><text class="peak glow" filter="url(#soft)" x="268" y="100" text-anchor="middle">flutter</text><text class="peak" x="268" y="100" text-anchor="middle">flutter</text></g></g>
  <g class="mark m2"><line class="lead" x1="452" y1="142" x2="452" y2="112"/><circle class="dot" cx="452" cy="150" r="2.5"/><g class="pulse p2"><text class="peak glow" filter="url(#soft)" x="452" y="100" text-anchor="middle">go</text><text class="peak" x="452" y="100" text-anchor="middle">go</text></g></g>
  <g class="mark m3"><line class="lead" x1="652" y1="172" x2="652" y2="112"/><circle class="dot" cx="652" cy="180" r="2.5"/><g class="pulse p3"><text class="peak glow" filter="url(#soft)" x="652" y="100" text-anchor="middle">fastapi</text><text class="peak" x="652" y="100" text-anchor="middle">fastapi</text></g></g>

  <line class="ground" x1="48" y1="272" x2="852" y2="272"/>
