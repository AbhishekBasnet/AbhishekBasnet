<svg xmlns="http://www.w3.org/2000/svg" width="808" height="300" viewBox="46 36 808 300" role="img" aria-label="Abhishek Man Basnet, backend engineer — flutter, go, fastapi">
  <style>
    .name { font: 300 30px 'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif; letter-spacing: -0.3px; fill: #ECEFF4; }
    .mono { font: 400 11px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.8px; fill: #8F9BB3; }
    .peak { font: 500 12px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #ECEFF4; }
    .ridge { fill: none; stroke: #88C0D0; stroke-width: 1.25; stroke-linejoin: miter; stroke-dasharray: 1; animation: draw 2.6s cubic-bezier(.6,.05,.3,1) both; }
    .ground { stroke: #3B4252; stroke-width: 1; }
    .lead { stroke: #8F9BB3; stroke-width: 1; stroke-dasharray: 2 3; }
    .dot { fill: #88C0D0; }
    .mark { animation: show 0.8s ease-out backwards; }
    .m1 { animation-delay: 1.6s; } .m2 { animation-delay: 2.0s; } .m3 { animation-delay: 2.4s; }
    .sun { fill: #BF616A; animation: rise 3s ease-out backwards; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: grow 12s ease-in-out infinite; }
    .pulse .peak { animation: tint 12s ease-in-out infinite; animation-delay: inherit; }
    .pulse .glow { fill: #88C0D0; opacity: 0; animation: glow 12s ease-in-out infinite; animation-delay: inherit; }
    .p1 { animation-delay: 5s; } .p2 { animation-delay: 5.7s; } .p3 { animation-delay: 6.4s; }
    .trace { fill: none; stroke-dasharray: 0.08 1.2; stroke-dashoffset: 0.08; opacity: 0; animation: trace 12s ease-in-out 8s infinite; }
    .trace.line { stroke: #ECEFF4; stroke-width: 2; stroke-linecap: round; }
    .trace.halo { stroke: #88C0D0; stroke-width: 5; stroke-linecap: round; }
    .ripple { fill: none; stroke: #BF616A; stroke-width: 1.25; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; opacity: 0; animation: ripple 12s ease-out 10.2s infinite; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes show { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes grow { 0%, 11.7%, 100% { transform: none; } 5.25% { transform: scale(1.14); } }
    @keyframes tint { 0%, 11.7%, 100% { fill: #ECEFF4; } 5.25% { fill: #88C0D0; } }
    @keyframes glow { 0%, 11.7%, 100% { opacity: 0; } 5.25% { opacity: 0.85; } }
    @keyframes trace { 0% { stroke-dashoffset: 0.08; opacity: 0; } 1.5%, 18.5% { opacity: 1; } 20%, 100% { stroke-dashoffset: -1; opacity: 0; } }
    @keyframes ripple { 0% { transform: none; opacity: 0; } 1% { opacity: 0.9; } 13.3%, 100% { transform: scale(6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ridge, .sun, .mark, .pulse, .pulse .peak, .pulse .glow, .trace, .ripple { animation: none; } }
  </style>
  <filter id="soft" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="3.5"/></filter>

  <text class="mono" x="48" y="56">28.39° N   84.12° E</text>
  <circle class="ripple" cx="792" cy="118" r="6"/>
  <circle class="sun" cx="792" cy="118" r="6"/>

