<svg xmlns="http://www.w3.org/2000/svg" width="808" height="370" viewBox="46 36 808 370" role="img" aria-label="Abhishek Man Basnet, backend engineer — flutter, go, fastapi">
  <style>
    .name { font: 300 30px 'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif; letter-spacing: -0.3px; fill: #2E3440; }
    .mono { font: 400 11px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.8px; fill: #6B7891; }
    .peak { font: 500 12px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #2E3440; }
    .ridge { fill: none; stroke: #5E81AC; stroke-width: 1.25; stroke-linejoin: miter; stroke-dasharray: 1; animation: draw 2.6s cubic-bezier(.6,.05,.3,1) both; }
    .ground { stroke: #D8DEE9; stroke-width: 1; }
    .lead { stroke: #6B7891; stroke-width: 1; stroke-dasharray: 2 3; }
    .dot { fill: #5E81AC; }
    .mark { animation: show 0.8s ease-out backwards; }
    .m1 { animation-delay: 1.6s; } .m2 { animation-delay: 2.0s; } .m3 { animation-delay: 2.4s; }
    .sun { animation: rise 3s ease-out backwards; }
    .breath { opacity: 0.1; transform-box: fill-box; transform-origin: center; animation: breathe 9s ease-in-out 3s infinite alternate; }
    .sky { animation: appear 1.6s ease-out 3.2s backwards; }
    .star { fill: #ECEFF4; animation: twinkle 4s ease-in-out infinite; }
    .cloud { fill: #E5E9F0; }
    .mist { fill: #E5E9F0; }
    .drift { animation: drift 22s ease-in-out 4.8s infinite alternate; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: grow 12s ease-in-out infinite; }
    .pulse .peak { animation: tint 12s ease-in-out infinite; animation-delay: inherit; }
    .pulse .glow { fill: #5E81AC; opacity: 0; animation: glow 12s ease-in-out infinite; animation-delay: inherit; }
    .p1 { animation-delay: 5s; } .p2 { animation-delay: 5.7s; } .p3 { animation-delay: 6.4s; }
    .trace { fill: none; stroke-dasharray: 0.08 1.2; stroke-dashoffset: 0.08; opacity: 0; animation: trace 12s ease-in-out 8s infinite; }
    .trace.line { stroke: #2E3440; stroke-width: 2; stroke-linecap: round; }
    .trace.halo { stroke: #5E81AC; stroke-width: 5; stroke-linecap: round; }
    .ripple-g { transform-box: fill-box; transform-origin: center; animation: ripple-grow 12s cubic-bezier(.2,.6,.3,1) 10.2s infinite; }
    .ripple { fill: none; stroke: #BF616A; stroke-width: 1.6; vector-effect: non-scaling-stroke; opacity: 0; animation: ripple-fade 12s linear 10.2s infinite; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes show { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes breathe { from { opacity: 0.1; transform: none; } to { opacity: 0.2; transform: scale(1.2); } }
    @keyframes grow { 0%, 11.7%, 100% { transform: none; } 5.25% { transform: scale(1.14); } }
    @keyframes tint { 0%, 11.7%, 100% { fill: #2E3440; } 5.25% { fill: #5E81AC; } }
    @keyframes glow { 0%, 11.7%, 100% { opacity: 0; } 5.25% { opacity: 0.85; } }
    @keyframes trace { 0% { stroke-dashoffset: 0.08; opacity: 0; } 1.5%, 18.5% { opacity: 1; } 20%, 100% { stroke-dashoffset: -1; opacity: 0; } }
    @keyframes ripple-grow { 0% { transform: none; } 22%, 100% { transform: scale(4.6); } }
    @keyframes ripple-fade { 0% { opacity: 0; stroke-width: 1.6; } 1% { opacity: 0.85; stroke-width: 1.6; } 22%, 100% { opacity: 0; stroke-width: 0.3; } }
    @keyframes appear { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @keyframes twinkle { 50% { opacity: 0.12; } }
    @keyframes drift { to { transform: translateX(14px); } }
    @keyframes drift-near { to { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { .ridge, .sun, .breath, .mark, .pulse, .pulse .peak, .pulse .glow, .trace, .ripple-g, .ripple, .sky, .star, .drift { animation: none; } }
  </style>
  <filter id="soft" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <filter id="fog" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="2.4"/></filter>

  <text class="mono" x="48" y="56">28.39° N   84.12° E</text>
  <g class="ripple-g"><circle class="ripple" cx="792" cy="92" r="11"/></g>
  <g class="sun">
    <circle class="breath" cx="792" cy="92" r="24" fill="#D08770" filter="url(#soft)"/>
    <circle cx="792" cy="92" r="11" fill="#BF616A"/>
  </g>
  <g class="sky">
    <g class="drift" style="animation-name:drift;animation-duration:31s;animation-delay:6.0s"><rect class="cloud" x="520.0" y="68.0" width="60.0" height="10.0" rx="5.0"/><circle class="cloud" cx="538.0" cy="68.0" r="10.0"/><circle class="cloud" cx="554.0" cy="64.0" r="13.0"/><circle class="cloud" cx="568.0" cy="69.0" r="8.0"/></g>
    <g class="drift" style="animation-name:drift-near;animation-duration:18s;animation-delay:5.2s"><rect class="cloud" x="746.0" y="100.0" width="48.0" height="8.0" rx="4.0"/><circle class="cloud" cx="760.4" cy="100.0" r="8.0"/><circle class="cloud" cx="773.2" cy="96.8" r="10.4"/><circle class="cloud" cx="784.4" cy="100.8" r="6.4"/></g>
  </g>

  <path class="ridge" pathLength="1" d="M48 332 L100 316 L140 322 L176 300 L200 274 L226 296 L244 288 L268 264 L300 284 L338 272 L380 296 L420 254 L452 220 L486 246 L516 238 L560 284 L604 272 L652 250 L690 282 L740 306 L790 298 L852 320"/>
  <path class="trace halo" filter="url(#soft)" pathLength="1" d="M48 332 L100 316 L140 322 L176 300 L200 274 L226 296 L244 288 L268 264 L300 284 L338 272 L380 296 L420 254 L452 220 L486 246 L516 238 L560 284 L604 272 L652 250 L690 282 L740 306 L790 298 L852 320"/>
  <path class="trace line" pathLength="1" d="M48 332 L100 316 L140 322 L176 300 L200 274 L226 296 L244 288 L268 264 L300 284 L338 272 L380 296 L420 254 L452 220 L486 246 L516 238 L560 284 L604 272 L652 250 L690 282 L740 306 L790 298 L852 320"/>
    <g class="sky" filter="url(#fog)"><ellipse class="mist drift" cx="198" cy="292" rx="52" ry="6" style="opacity:0.95;animation-name:drift-near;animation-duration:24s;animation-delay:5.0s"/><ellipse class="mist drift" cx="226" cy="301" rx="40" ry="5" style="opacity:0.85;animation-name:drift-near;animation-duration:31s;animation-delay:5.6s"/><ellipse class="mist drift" cx="168" cy="303" rx="30" ry="4" style="opacity:0.7;animation-name:drift-near;animation-duration:19s;animation-delay:6.2s"/></g>

  <g class="mark m1"><line class="lead" x1="268" y1="256" x2="268" y2="182"/><circle class="dot" cx="268" cy="264" r="2.5"/><g class="pulse p1"><text class="peak glow" filter="url(#soft)" x="268" y="170" text-anchor="middle">flutter</text><text class="peak" x="268" y="170" text-anchor="middle">flutter</text></g></g>
  <g class="mark m2"><line class="lead" x1="452" y1="212" x2="452" y2="182"/><circle class="dot" cx="452" cy="220" r="2.5"/><g class="pulse p2"><text class="peak glow" filter="url(#soft)" x="452" y="170" text-anchor="middle">go</text><text class="peak" x="452" y="170" text-anchor="middle">go</text></g></g>
  <g class="mark m3"><line class="lead" x1="652" y1="242" x2="652" y2="182"/><circle class="dot" cx="652" cy="250" r="2.5"/><g class="pulse p3"><text class="peak glow" filter="url(#soft)" x="652" y="170" text-anchor="middle">fastapi</text><text class="peak" x="652" y="170" text-anchor="middle">fastapi</text></g></g>

  <line class="ground" x1="48" y1="342" x2="852" y2="342"/>
  <text class="name" x="46" y="388">Abhishek Man Basnet</text>
  <text class="mono" x="852" y="386" text-anchor="end">backend engineer · nepal</text>
</svg>
