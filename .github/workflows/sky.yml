name: Daily sky

# Rolls a new sky (clouds, wind, stars, shooting stars) once a day and publishes
# the SVGs to the `output` branch, which the README shows. The branch is replaced
# on every run, so it never builds up history and main gets no daily commits.

on:
  schedule:
    - cron: "15 18 * * *"   # 00:00 in Nepal (UTC+5:45)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/sky.yml

permissions:
  contents: write

concurrency:
  group: daily-sky
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the sky rules
        run: python -m unittest discover -s scripts/tests -t scripts

      - name: Roll today's sky
        run: python scripts/build_assets.py --seed "$(TZ=Asia/Kathmandu date +%F)" --out dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: Daily sky
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
